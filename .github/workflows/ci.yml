name: CI

# XAYVEN CORE Phase 4.5 — validation-only guardrail. Runs the exact same
# 4 checks that have been run by hand before every phase commit so far
# (typecheck, lint, test, build). Deliberately does nothing else: no
# deploy step, no Hostinger/Supabase connection, no secrets, no write
# permissions. If this workflow ever grows a deploy job, that must be a
# separate, explicitly-approved phase — not an addition to this file.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/services-commercial-platform

# Read-only by default for every job in this workflow (GITHUB_TOKEN).
# Nothing here needs to write to the repo, comment on PRs, or touch
# packages/deployments.
permissions:
  contents: read

jobs:
  validate:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22.x — XAYVEN CORE Phase 5 (Node Runtime Alignment). Matches
      # the real production runtime: Hostinger → XAYVEN → Ajustes y
      # reimplementación → Versión del Node shows 22.x actually selected
      # and running. Hostinger only exposes a major/minor line selector
      # (24.x / 22.x / 20.x / 18.x), never an exact patch — so there is no
      # evidence available to justify pinning a specific 22.X.Y the way
      # Phase 4.5 pinned an exact 24.18.0. This intentionally REPLACES the
      # Phase 4.5 pin (which matched local/CI, not production) rather than
      # adding a second job, so CI now tests the same major runtime
      # production actually executes.
      #
      # KNOWN RESIDUAL RISK, documented not resolved here: geoip-lite
      # 2.0.3 (a direct production dependency, see next.config.ts's
      # serverExternalPackages) declares "engines": { "node": ">=24.0.0" }
      # in its own package.json — a documented mismatch against this
      # Node 22.x pin and against Hostinger's real Node 22.x runtime.
      # Read the installed source (node_modules/geoip-lite/lib/*.js):
      # plain CommonJS (require('fs')/require('net')/require('path')), no
      # Node-24-exclusive API found. No engine-strict in this repo (no
      # .npmrc), so `npm ci` should only warn (EBADENGINE), never fail, on
      # this mismatch — inferred from the absent engine-strict setting,
      # not empirically observed (no Node 22.x available to test against
      # locally; this workflow's own first real run is the actual proof).
      # geoip-lite already runs in real production on Node 22.x today
      # without a reported incident, and its own lookupCountryFromIp()
      # try/catch (Phase 3.1) degrades to the default market on any
      # failure rather than crashing a request. Not
      # touched, updated, or replaced here — a distinct scope, explicitly
      # out of this change.
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Phase 4.5 fix — `tsc --noEmit` depends on `.next/types/**` (see
      # tsconfig.json's `include`): Next.js generates the global
      # `PageProps<Route>`/`LayoutProps<Route>` ambient types there (used
      # by every src/app/[locale]/** page/layout), and only `next build`
      # or `next dev` produce that directory. A clean checkout has no
      # `.next/` at all, so `npm run typecheck` fails with TS2304 before
      # `npm run build` ever runs — reproduced empirically. `next build`
      # itself would also regenerate these types, but it's a full
      # production build; `next typegen` is Next's own documented command
      # ("Generate TypeScript definitions for routes, pages, and layouts
      # without running a full build") for exactly this dependency, and
      # runs in ~1s instead of a full build. Confirmed empirically that
      # typegen alone (no build) is sufficient for `tsc --noEmit` to pass.
      - name: Generate route types (next typegen)
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
